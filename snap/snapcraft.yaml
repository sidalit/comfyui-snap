name: comfyui
base: core26
version: '0.42.1'
title: ComfyUI
icon: snap/gui/comfyui.png
summary: Node-based workflows for generative AI images, video and audio
description: |
  ComfyUI provides a browser interface for building and running generative AI
  workflows with local models. Models are supplied separately.

  NVIDIA GPU support is provided by the torch-cuda component.

  The server runs at http://127.0.0.1:8188. Startup, listening address
  and port can be configured through snap settings. Models,
  inputs, outputs and settings are stored in /var/snap/comfyui/common.
  Install comfy-desktop for the desktop application.

  The comfyui command remains available for a separate foreground server.
license: GPL-3.0-or-later
grade: stable
confinement: strict
website: https://www.comfy.org/
source-code:
  - https://github.com/Comfy-Org/ComfyUI
  - https://github.com/sidalit/comfyui-snap
issues:
  - https://github.com/Comfy-Org/ComfyUI/issues
  - https://github.com/sidalit/comfyui-snap/issues
contact: https://github.com/sidalit/comfyui-snap/issues

assumes:
  - snapd2.68 # for components support

platforms:
  amd64:
  arm64:

environment:
  # Path to access current revision of components
  SNAP_COMPONENTS: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION
  # Prefer the CUDA build of PyTorch when the torch-cuda component is installed
  PYTHONPATH: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION/torch-cuda/site-packages
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
  HF_HOME: $SNAP_USER_COMMON/.cache/huggingface
  TORCH_HOME: $SNAP_USER_COMMON/.cache/torch
  CUDA_CACHE_PATH: $SNAP_USER_COMMON/.cache/nvidia
  LD_LIBRARY_PATH: $SNAP_LIBRARY_PATH:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR

hooks:
  configure:
    plugs:
      # For GPU detection through PCI vendor IDs
      - opengl

slots:
  server:
    interface: content
    content: comfyui-server-v1
    read:
      - $SNAP_COMMON/server

apps:
  comfyui:
    command: bin/comfyui
    plugs:
      - home
      - network
      - network-bind
      - opengl
      - removable-media

  daemon:
    command: bin/comfyui-server
    daemon: simple
    install-mode: disable
    restart-condition: on-failure
    plugs:
      - network
      - network-bind
      - opengl

parts:
  comfyui:
    plugin: nil
    source: https://github.com/Comfy-Org/ComfyUI.git
    source-tag: v$SNAPCRAFT_PROJECT_VERSION
    build-packages:
      - python3-venv
      - python3-dev
      - build-essential
      - binutils
      - pkg-config
      - git
    stage-packages:
      - git
      - python3-venv
      - libgl1
      - libegl1
    override-build: |
      /usr/bin/python3 -m venv "$CRAFT_PART_INSTALL"
      # CPU build of PyTorch; keep the versions in sync with the torch-cuda part.
      "$CRAFT_PART_INSTALL/bin/python3" -m pip install --no-cache-dir --no-compile \
        --extra-index-url https://download.pytorch.org/whl/cpu \
        'torch==2.14.1+cpu' 'torchvision==0.29.1+cpu' \
        -r requirements.txt -r manager_requirements.txt

      # Drop build metadata while keeping sources and runtime libraries.
      site_packages=$("$CRAFT_PART_INSTALL/bin/python3" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
      find "$site_packages/comfyui_frontend_package/static" -type f -name '*.map' -delete

      # Use the bundled interpreter after the snap is mounted.
      ln -sf ../usr/bin/python3 "$CRAFT_PART_INSTALL/bin/python3"
      sed -i 's|^home = .*|home = /snap/comfyui/current/usr/bin|' "$CRAFT_PART_INSTALL/pyvenv.cfg"
      find "$CRAFT_PART_INSTALL/bin" -type f -exec \
        sed -i "1 s|^#!$CRAFT_PART_INSTALL/bin/python3$|#!/usr/bin/env python3|" {} +

      mkdir -p "$CRAFT_PART_INSTALL/share/comfyui"
      git -C "$CRAFT_PART_SRC" archive HEAD | tar -x -C "$CRAFT_PART_INSTALL/share/comfyui"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/share/doc/comfyui/LICENSE"
    prime:
      - -share/comfyui/.github
      - -share/comfyui/tests
      - -share/comfyui/tests-unit
      - -usr/share/doc
      - -usr/share/man

  # The component only adds what the base snap lacks: the CUDA builds of torch
  # and torchvision, Triton and the NVIDIA libraries.
  torch-cuda:
    after: [comfyui]
    plugin: nil
    build-packages:
      - python3-venv
      - binutils
    override-build: |
      # Install into a venv, which unpacks wheels in place; pip --target would
      # first unpack everything in /tmp, a small tmpfs.
      /usr/bin/python3 -m venv "$CRAFT_PART_BUILD/venv"
      "$CRAFT_PART_BUILD/venv/bin/python3" -m pip install --no-cache-dir --no-compile \
        --extra-index-url https://download.pytorch.org/whl/cu130 \
        'torch==2.14.1+cu130' 'torchvision==0.29.1+cu130'
      target="$CRAFT_PART_INSTALL/site-packages"
      rm -rf "$target"
      mv "$CRAFT_PART_BUILD/venv"/lib/python3*/site-packages "$target"

      # Remove dependencies already in the base snap.
      base=$(echo "$CRAFT_STAGE"/lib/python3*/site-packages)
      for path in "$target"/*; do
        case "${path##*/}" in
          torch | torch-* | torchvision*) ;;
          *) [ ! -e "$base/${path##*/}" ] || rm -rf "$path" ;;
        esac
      done

      # Drop debug symbols and static libraries.
      strip --strip-debug "$target/triton/_C/libtriton.so" "$target/triton/_C/libproton.so"
      rm -f "$target/triton/backends/nvidia/lib/cupti/libcupti_static.a" \
        "$target/triton/backends/nvidia/lib/cupti-blackwell/libcupti_static.a"
    organize:
      "*": (component/torch-cuda)

  launcher:
    plugin: dump
    source: snap/local

components:
  torch-cuda:
    type: standard
    summary: PyTorch with CUDA 13.0 for NVIDIA GPUs
    description: CUDA builds of PyTorch, torchvision and Triton with the NVIDIA runtime libraries
